<script src="/js/accessibility.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatable examples — MJB ADHD</title><meta name="description" content="Original relatable illustrations about starting, browser detours and time awareness, with clear explanations and deeper links."><link rel="canonical" href="https://mjb-adhd.org.uk/support/relatable-examples/"><link rel="stylesheet" href="/css/core.css"><link rel="stylesheet" href="/css/sleek.css"><link rel="stylesheet" href="/css/atlas.css"><link rel="stylesheet" href="/css/navigation.css">
<link rel="stylesheet" href="/css/accessibility.css">
</head><body data-page="relatable-examples" data-depth="2"><a class="skip-link" href="#main-content">Skip to content</a><header id="site-header" class="top"><a href="/">MJB ADHD home</a><noscript><a href="/navigation/">Browse all topics</a></noscript></header><main class="wrap" id="main-content"><h1>Relatable examples</h1><p class="lede">Sometimes a picture gets the experience across quickly. These original examples are jokes and illustrations; experiences vary, and recognising one does not establish a diagnosis.</p><figure class="atlas-figure"><h3>One useful tab</h3><img src="/assets/relatable/one-tab.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: one browser tab becomes many tabs. Text: Me: One useful tab. The tabs: We invited friends."><figcaption>One question can turn into several detours. This is a relatable exaggeration, not a diagnostic example.</figcaption><p><a href="/guide/index.html#/n/memory-time-awareness">Explore the related explanation</a> · <a href="/assets/relatable/one-tab.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>The missing start button</h3><img src="/assets/relatable/start-button.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a clear task plan beside a waiting start button. Text: The plan: Start the thing. The start button: Please wait."><figcaption>Wanting to act and getting started can feel very different. The image illustrates an experience, not a proven mechanism.</figcaption><p><a href="/support/quick-starts/">Explore the related explanation</a> · <a href="/assets/relatable/start-button.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>Just two minutes</h3><img src="/assets/relatable/two-minutes.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a clock labelled 10:00 becomes 12:00. Text: Me: Just two minutes. Time: That was a suggestion."><figcaption>A joke about losing track of time while absorbed. Experiences vary, and this image cannot identify ADHD.</figcaption><p><a href="/guide/index.html#/n/memory-time-awareness">Explore the related explanation</a> · <a href="/assets/relatable/two-minutes.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>I will remember that</h3><img src="/assets/relatable/remember-later.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a note labelled Remember this, then an empty note with a question mark. Text: Me: I will remember that. Brain: Remember what?"><figcaption>A joke about losing an intention before acting on it. An external note can keep the next action visible; recognising the joke is not a diagnosis.</figcaption><p><a href="/guide/index.html#/n/memory-time-awareness">Explore the related explanation</a> · <a href="/assets/relatable/remember-later.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>Somewhere very safe</h3><img src="/assets/relatable/somewhere-safe.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a key placed in a box, then three identical boxes marked with question marks. Text: Me: It is somewhere safe. Somewhere safe: Classified."><figcaption>A relatable exaggeration about misplaced objects. A consistent visible home for an item can reduce searching; this experience is not unique to ADHD.</figcaption><p><a href="/support/quick-starts/">Explore the related explanation</a> · <a href="/assets/relatable/somewhere-safe.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>Almost finished</h3><img src="/assets/relatable/new-idea.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a progress bar nearly full, then a bright new idea next to an unfinished bar. Text: Task: Almost finished. Brain: New idea unlocked."><figcaption>A joke about a fresh idea interrupting completion. Keeping an ideas list beside the current task can preserve the idea without losing the next step.</figcaption><p><a href="/support/quick-starts/">Explore the related explanation</a> · <a href="/assets/relatable/new-idea.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>All channels selected</h3><img src="/assets/relatable/all-channels.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: one active sound slider, then six active sliders. Text: Room: Just background noise. Brain: All channels selected."><figcaption>An illustration of feeling overloaded by competing inputs. Sensory experiences vary and can have many explanations; this is not a diagnostic example.</figcaption><p><a href="/guide/index.html#/n/sensory-feedback">Explore the related explanation</a> · <a href="/assets/relatable/all-channels.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>Explain briefly</h3><img src="/assets/relatable/briefly.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a small form with three lines, then a row of dated timeline cards. Text: Form: Explain it briefly. Me: Opens the full timeline."><figcaption>A joke about fitting a complicated experience into a small form. Lead with the decision needed, then provide the supporting chronology.</figcaption><p><a href="/guide/index.html#/n/appointment-preparation">Explore the related explanation</a> · <a href="/assets/relatable/briefly.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>The first step</h3><img src="/assets/relatable/staircase.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: one step marked Start, then a large staircase of planning steps. Text: Plan: One step at a time. Me: Builds a staircase first."><figcaption>Planning can become a task of its own. A small concrete next action can make the starting point clearer; the image is a joke, not a mechanism claim.</figcaption><p><a href="/support/quick-starts/">Explore the related explanation</a> · <a href="/assets/relatable/staircase.svg">Open image</a></p></figure></main><script defer src="/js/registry.js"></script><script defer src="/js/navigation-data.js"></script>
