</head><body data-page="relatable-examples" data-depth="2"><a class="skip-link" href="#main-content">Skip to content</a><header id="site-header" class="top"><a href="/">MJB ADHD home</a><noscript><a href="/navigation/">Browse all topics</a></noscript></header><main class="wrap" id="main-content"><h1>Relatable examples</h1><p class="lede">Sometimes a picture gets the experience across quickly. These original examples are jokes and illustrations; experiences vary, and recognising one does not establish a diagnosis.</p><figure class="atlas-figure"><h3>One useful tab</h3><img src="/assets/relatable/one-tab.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: one browser tab becomes many tabs. Text: Me: One useful tab. The tabs: We invited friends."><figcaption>One question can turn into several detours. This is a relatable exaggeration, not a diagnostic example.</figcaption><p><a href="/guide/index.html#/n/memory-time-awareness">Explore the related explanation</a> · <a href="/assets/relatable/one-tab.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>The missing start button</h3><img src="/assets/relatable/start-button.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a clear task plan beside a waiting start button. Text: The plan: Start the thing. The start button: Please wait."><figcaption>Wanting to act and getting started can feel very different. The image illustrates an experience, not a proven mechanism.</figcaption><p><a href="/support/quick-starts/">Explore the related explanation</a> · <a href="/assets/relatable/start-button.svg">Open image</a></p></figure><figure class="atlas-figure"><h3>Just two minutes</h3><img src="/assets/relatable/two-minutes.svg" width="1000" height="640" loading="lazy" alt="Original two-panel meme: a clock labelled 10:00 becomes 12:00. Text: Me: Just two minutes. Time: That was a suggestion."><figcaption>A joke about losing track of time while absorbed. Experiences vary, and this image cannot identify ADHD.</figcaption><p><a href="/guide/index.html#/n/memory-time-awareness">Explore the related explanation</a> · <a href="/assets/relatable/two-minutes.svg">Open image</a></p></figure></main><script defer src="/js/registry.js"></script><script defer src="/js/navigation-data.js"></script>
