<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Useful visual guides — MJB ADHD</title><meta name="description" content="Short visual guides to evidence, handovers, preparing questions and finding your place on the website."><link rel="canonical" href="https://mjb-adhd.org.uk/support/visual-guides/"><link rel="stylesheet" href="/css/core.css"><link rel="stylesheet" href="/css/sleek.css"><link rel="stylesheet" href="/css/atlas.css"><link rel="stylesheet" href="/css/navigation.css">
</head><body data-page="visual-guides" data-depth="2"><a class="skip-link" href="#main-content">Skip to content</a><header id="site-header" class="top"><a href="/">MJB ADHD home</a><noscript><a href="/navigation/">Browse all topics</a></noscript></header><main class="wrap" id="main-content"><h1>Useful visual guides</h1><p class="lede">Start with the picture, then read the detail when you need it.</p><figure class="atlas-figure" id="read-the-evidence"><h3>Three different evidence questions</h3><img loading="lazy" src="/assets/visual-guides/read-the-evidence.svg" width="1440" height="850" alt="Three different evidence questions. A mechanism, an association and an individual conclusion are different kinds of evidence. A connection between these questions needs evidence; it is not automatic."><figcaption>Use the question to recognise the scope of a claim. A normal pathway does not prove a defect; an association does not prove an individual cause.</figcaption><p><a href="/science/process-atlas/">Read the related explanation</a> · <a href="/assets/visual-guides/read-the-evidence.svg">Open full-size illustration</a></p><details><summary>Read the image as text</summary><p>A mechanism, an association and an individual conclusion are different kinds of evidence.</p><ul><li><strong>Mechanism</strong>: How can a biological process work? Enzymes, transporters, cells and model experiments.</li><li><strong>Association</strong>: What varies together in a study? A statistical result needs its sample, effect and uncertainty.</li><li><strong>Individual conclusion</strong>: What does this mean for this person? Clinical and genetic interpretation needs additional evidence.</li></ul><p>A connection between these questions needs evidence; it is not automatic.</p></details></figure><figure class="atlas-figure" id="close-the-handover"><h3>Make a handover visible</h3><img loading="lazy" src="/assets/visual-guides/close-the-handover.svg" width="1440" height="850" alt="Make a handover visible. A practical checklist for following a referral or transfer; ask the service which process applies. A sent message is not the same event as an accepted handover or a completed action."><figcaption>This is a record-organising tool, not a declaration that every referral guarantees treatment. Ask for the actual status and next decision.</figcaption><p><a href="/guide/index.html#/n/transfer-handover">Read the related explanation</a> · <a href="/assets/visual-guides/close-the-handover.svg">Open full-size illustration</a></p><details><summary>Read the image as text</summary><p>A practical checklist for following a referral or transfer; ask the service which process applies.</p><ul><li><strong>The sender</strong>: What was sent, when and to whom? Keep the referral, summary and reference.</li><li><strong>The receiver</strong>: Was it received and accepted? Separate delivery, triage, acceptance and responsibility.</li><li><strong>The next action</strong>: Who does what, by when? Record the plan, contact and how an overdue action is escalated.</li></ul><p>A sent message is not the same event as an accepted handover or a completed action.</p></details></figure><figure class="atlas-figure" id="prepare-the-question"><h3>A short account with useful detail</h3><img loading="lazy" src="/assets/visual-guides/prepare-the-question.svg" width="1440" height="850" alt="A short account with useful detail. Lead with what has changed and the decision you need; keep the supporting detail available. A clear short account can link to a full chronology without trying to fit everything into one box."><figcaption>A template for structuring an appointment question or written update. It does not replace reporting urgent concerns to the relevant clinical service.</figcaption><p><a href="/guide/index.html#/n/appointment-preparation">Read the related explanation</a> · <a href="/assets/visual-guides/prepare-the-question.svg">Open full-size illustration</a></p><details><summary>Read the image as text</summary><p>Lead with what has changed and the decision you need; keep the supporting detail available.</p><ul><li><strong>Change and impact</strong>: What is different from your baseline? Name the practical effect and relevant dates.</li><li><strong>Evidence and uncertainty</strong>: Which record supports which point? Separate observation, your report and a working hypothesis.</li><li><strong>Decision needed</strong>: What answer or next action are you asking for? Ask who owns it and when you will receive the answer.</li></ul><p>A clear short account can link to a full chronology without trying to fit everything into one box.</p></details></figure><figure class="atlas-figure" id="find-your-place"><h3>Browse, search and keep your place</h3><img loading="lazy" src="/assets/visual-guides/find-your-place.svg" width="1440" height="850" alt="Browse, search and keep your place. Three routes through this website, with the current section always visible. The location path describes the topic hierarchy, not your private browsing history."><figcaption>The menu and breadcrumb work together. On larger screens you can pin the explorer; on a phone it opens as a drawer.</figcaption><p><a href="/navigation/">Read the related explanation</a> · <a href="/assets/visual-guides/find-your-place.svg">Open full-size illustration</a></p><details><summary>Read the image as text</summary><p>Three routes through this website, with the current section always visible.</p><ul><li><strong>Browse by topic</strong>: Open the menu, then choose a category. Only the selected branch opens; the current page is marked.</li><li><strong>Search a specific term</strong>: Use search when you know the word or phrase. Results include the section path as well as the title.</li><li><strong>Move through parents</strong>: Use the location path or optional desktop sidebar. Return to a parent section without retracing every link.</li></ul><p>The location path describes the topic hierarchy, not your private browsing history.</p></details></figure></main><script defer src="/js/registry.js"></script><script defer src="/js/navigation-data.js"></script>
