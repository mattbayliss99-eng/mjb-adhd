<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">Nutrition: supply, transport and evidence limits</title><desc id="desc">Diet provides substrates whose absorption, circulating handling and brain entry are regulated. The figure uses nutrient transport as a supported example, including large-neutral-amino-acid and glucose transport. It deliberately does not draw gut dopamine or serotonin travelling directly into brain synapses. Microbiome findings require separate evidence and cannot be treated as treatment efficacy or a reason to start supplements. This overview contains no individual nutritional diagnosis or intervention claim.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F28</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">Nutrition: supply, transport and evidence limits</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">Nutrients pass through absorption and regulated transport before brain use.</tspan></text><path d="M488 355.0H578" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="487.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="487.0" dy="0">digestion /</tspan><tspan x="487.0" dy="22">uptake</tspan></text><path d="M1018 355.0H1108" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">circulation</tspan></text><path d="M1330.0 478V558" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1346.0" y="510.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1346.0" dy="0">transport</tspan></text><path d="M1112 685.0H1022" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="652.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">cellular use</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#eaf3ff" stroke="#3a6d99" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#3a6d99"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Dietary inputs</tspan></text><text class="" x="84" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Food supplies protein and</tspan><tspan x="84" dy="31">micronutrients.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Intestinal uptake</tspan></text><text class="" x="614" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Absorption contributes to</tspan><tspan x="614" dy="31">circulating availability.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Blood and metabolism</tspan></text><text class="" x="1144" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">The circulating pool is</tspan><tspan x="1144" dy="31">processed and regulated.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#29705e"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Brain-barrier transport</tspan></text><text class="" x="1144" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Specific transport systems</tspan><tspan x="1144" dy="31">control entry of substrates.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#29705e"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Intracellular pathways</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Enzymes and cofactors</tspan><tspan x="614" dy="31">determine subsequent use.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#fff4db" stroke="#9c6a17" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#9c6a17"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Microbiome claims</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Association does not establish</tspan><tspan x="84" dy="31">an effective ADHD treatment.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">Gut transmitter production is not a direct measure of brain synaptic supply.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Arrows: the labelled process or relationship; omitted steps are explained below the image.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: S07, S08, N-GLUT1, S31 · Scope and full references accompany this diagram.</tspan></text></svg>