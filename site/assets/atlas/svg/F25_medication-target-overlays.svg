<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">Medication target overlays</title><desc id="desc">Methylphenidate and atomoxetine principally inhibit reuptake through different target profiles. Dexamfetamine has substrate/releasing actions and additional intracellular effects demonstrated in experimental models. These distinctions do not exhaust the pharmacology or settle how a medicine improves ADHD symptoms. Evidence from cell or animal preparations cannot be read directly as a therapeutic concentration, personal response prediction or dose equivalence. Current product-specific information is linked; an individual prescribing decision remains separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F25</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">Medication target overlays</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">Three medicines, different target actions: a simplified comparison.</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#29705e"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Methylphenidate</tspan></text><text class="" x="84" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Inhibits dopamine and</tspan><tspan x="84" dy="31">noradrenaline reuptake;</tspan><tspan x="84" dy="31">product formulation matters.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Atomoxetine</tspan></text><text class="" x="614" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Selective noradrenaline</tspan><tspan x="614" dy="31">transporter inhibition is its</tspan><tspan x="614" dy="31">principal described action.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Dexamfetamine</tspan></text><text class="" x="1144" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Acts as a</tspan><tspan x="1144" dy="31">monoamine-transporter</tspan><tspan x="1144" dy="31">substrate and can promote</tspan><tspan x="1144" dy="31">release.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#29705e"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Transporter context</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">DAT and NET expression vary</tspan><tspan x="84" dy="31">between brain regions.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#29705e"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Downstream response</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Receptors, signalling and</tspan><tspan x="614" dy="31">network state shape effects.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#fff4db" stroke="#9c6a17" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#9c6a17"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Clinical interpretation</tspan></text><text class="" x="1144" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Target action alone does not</tspan><tspan x="1144" dy="31">predict benefit, safety or dose.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">A target diagram is not a medicine ranking or a personal treatment choice.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Numbered boxes are comparison points; no causal arrows implied.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: N-CONCERTA, N-ATOMOXETINE, N-AMFEXA, N-AMPH-TAAR, N-AMPH-VMAT · Scope and full references accompany this diagram.</tspan></text></svg>