<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">Genes regulation and development</title><desc id="desc">DNA differences may influence regulation or protein sequence, but an associated locus, a candidate effector gene and a demonstrated mechanism are different levels of evidence. Developmental context can change the consequences. Common-variant and rare-variant ADHD studies support investigation of neuronal biology; they do not establish a shared defect in every patient or justify treating every pathway gene as an ADHD risk gene. The 2025 childhood GWAS has a publisher correction that should accompany use of that study.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F01</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">Genes regulation and development</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">A genetic association and a molecular mechanism answer different questions.</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#f0eaf8" stroke="#7355a6" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#7355a6"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">DNA variation</tspan></text><text class="" x="84" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Common and rare variants are</tspan><tspan x="84" dy="31">studied using different designs.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Gene regulation</tspan></text><text class="" x="614" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Some variants may affect</tspan><tspan x="614" dy="31">when, where or how much a</tspan><tspan x="614" dy="31">gene is expressed.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Protein function</tspan></text><text class="" x="1144" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Other variants can alter a</tspan><tspan x="1144" dy="31">protein sequence or its</tspan><tspan x="1144" dy="31">function.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#29705e"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Cell and development</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Consequences depend on cell</tspan><tspan x="84" dy="31">type, timing and biological</tspan><tspan x="84" dy="31">context.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#f0eaf8" stroke="#7355a6" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#7355a6"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Population evidence</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">GWAS or rare-variant studies</tspan><tspan x="614" dy="31">test statistical association.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#fff4db" stroke="#9c6a17" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#9c6a17"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Individual</tspan><tspan x="1176" dy="34">interpretation</tspan></text><text class="" x="1144" y="680" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Association alone does not</tspan><tspan x="1144" dy="31">identify a causal change in one</tspan><tspan x="1144" dy="31">person.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">A pathway gene is not automatically an ADHD risk gene.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Numbered boxes are comparison points; no causal arrows implied.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: S02, S03, S04, S37 · Scope and full references accompany this diagram.</tspan></text></svg>