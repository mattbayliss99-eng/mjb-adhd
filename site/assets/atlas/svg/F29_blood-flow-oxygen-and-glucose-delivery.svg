<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">Blood flow oxygen and glucose delivery</title><desc id="desc">Blood carries oxygen, largely on haemoglobin, and glucose in solution. Oxygen leaves blood and diffuses through tissue; glucose uses transport systems including GLUT1 at the blood-brain barrier. The respiratory chain uses oxygen as a terminal electron acceptor. Transport/delivery limitations and defects of intracellular metabolism are different possibilities requiring their own evidence. ADHD alone demonstrates neither. This corrected diagram removes the implication that oxygen crosses through GLUT1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F29</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">Blood flow oxygen and glucose delivery</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">Oxygen and glucose have different delivery and membrane-entry routes.</tspan></text><path d="M488 355.0H578" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="487.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="487.0" dy="0">unloading /</tspan><tspan x="487.0" dy="22">diffusion</tspan></text><path d="M1018 355.0H1108" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">cellular use</tspan></text><path d="M488 685.0H578" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="487.0" y="652.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="487.0" dy="0">transport</tspan></text><path d="M1018 685.0H1108" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="652.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">metabolism</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#eaf3ff" stroke="#3a6d99" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#3a6d99"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Blood carries oxygen</tspan></text><text class="" x="84" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Most oxygen is transported</tspan><tspan x="84" dy="31">bound to haemoglobin.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Oxygen diffusion</tspan></text><text class="" x="614" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">After unloading, oxygen diffuses</tspan><tspan x="614" dy="31">into tissue; GLUT1 does not</tspan><tspan x="614" dy="31">carry it.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Respiratory chain</tspan></text><text class="" x="1144" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Oxygen accepts electrons at</tspan><tspan x="1144" dy="31">complex IV.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#eaf3ff" stroke="#3a6d99" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#3a6d99"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Circulating glucose</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Blood supplies glucose as a</tspan><tspan x="84" dy="31">metabolic substrate.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#29705e"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">GLUT1 at the barrier</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">SLC2A1 / GLUT1 transports</tspan><tspan x="614" dy="31">glucose across brain-barrier</tspan><tspan x="614" dy="31">cells.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#29705e"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Cellular metabolism</tspan></text><text class="" x="1144" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Glucose handling and oxygen</tspan><tspan x="1144" dy="31">use are distinct processes.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">Reduced delivery and impaired cellular use are different hypotheses.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Arrows: the labelled process or relationship; omitted steps are explained below the image.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: N-GLUT1, N-OXYGEN, S23 · Scope and full references accompany this diagram.</tspan></text></svg>