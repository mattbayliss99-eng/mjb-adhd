<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">TH reaction and regulation</title><desc id="desc">Tyrosine hydroxylase catalyses the rate-limiting hydroxylation step in catecholamine biosynthesis. It uses BH4, iron and oxygen to form L-DOPA in the cytosol. Enzyme activity is regulated, so substrate abundance alone does not determine downstream transmitter availability. Further synthesis, vesicular storage, release and clearance remain necessary. The figure omits full chemical stoichiometry and does not assert a TH defect or predict a therapeutic response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F32</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">TH reaction and regulation</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">Tyrosine hydroxylase chemistry: the reaction and its controls are separate.</tspan></text><path d="M488 355.0H578" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="487.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="487.0" dy="0">substrate</tspan></text><path d="M1018 355.0H1108" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">product</tspan></text><path d="M270.0 562V539H800.0V482" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="430.0" y="531" font-size="16" font-weight="400" fill="#34565f"><tspan x="430.0" dy="0">co-substrates</tspan></text><path d="M800.0 562V482" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="816.0" y="510.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="816.0" dy="0">cofactor</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#eaf3ff" stroke="#3a6d99" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#3a6d99"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">L-tyrosine</tspan></text><text class="" x="84" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Substrate in the cytosol.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">TH reaction</tspan></text><text class="" x="614" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Tyrosine hydroxylase forms</tspan><tspan x="614" dy="31">L-DOPA.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">L-DOPA</tspan></text><text class="" x="1144" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Product available for</tspan><tspan x="1144" dy="31">downstream AADC conversion.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#eaf3ff" stroke="#3a6d99" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#3a6d99"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">BH4 and oxygen</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Required for the hydroxylation</tspan><tspan x="84" dy="31">chemistry.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#eaf3ff" stroke="#3a6d99" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#3a6d99"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Iron cofactor</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Iron supports TH catalytic</tspan><tspan x="614" dy="31">activity.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#fff4db" stroke="#9c6a17" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#9c6a17"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Regulation and context</tspan></text><text class="" x="1144" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Enzyme amount/activity</tspan><tspan x="1144" dy="31">influence flux; no</tspan><tspan x="1144" dy="31">dopamine-level prediction.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">This is a cytosolic reaction; the arrow is not a direct route to a symptom.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Arrows: the labelled process or relationship; omitted steps are explained below the image.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: S10, S09 · Scope and full references accompany this diagram.</tspan></text></svg>