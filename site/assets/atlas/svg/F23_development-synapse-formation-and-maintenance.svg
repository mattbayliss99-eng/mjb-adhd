<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">Development synapse formation and maintenance</title><desc id="desc">Neuronal differentiation, synapse formation and maintenance provide a biological context for investigating genetic associations. The figure does not assign each named gene to one mandatory developmental stage. MAP1A, ANK2 and ANO8 are examples from the rare-variant paper published online in 2025 and in the 2026 issue; they must not be attributed to the 2023 common-variant GWAS. An association or enrichment can motivate experiments but does not demonstrate an individual developmental lesion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F23</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">Development synapse formation and maintenance</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">Developmental biology and genetic association require different evidence.</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#29705e"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Cell differentiation</tspan></text><text class="" x="84" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Cell identity and timing shape</tspan><tspan x="84" dy="31">later function.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Synapse formation</tspan></text><text class="" x="614" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Neurons form connections</tspan><tspan x="614" dy="31">within a developing</tspan><tspan x="614" dy="31">environment.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Maintenance and</tspan><tspan x="1176" dy="34">change</tspan></text><text class="" x="1144" y="350" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Connections remain responsive</tspan><tspan x="1144" dy="31">to activity and context.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#f0eaf8" stroke="#7355a6" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#7355a6"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Common-variant study</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">2023 GWAS identifies</tspan><tspan x="84" dy="31">associated regions and</tspan><tspan x="84" dy="31">enrichment.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#f0eaf8" stroke="#7355a6" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#7355a6"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Rare-variant study</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">MAP1A, ANK2 and ANO8 are</tspan><tspan x="614" dy="31">rare-variant examples from the</tspan><tspan x="614" dy="31">2025/26 study.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#fff4db" stroke="#9c6a17" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#9c6a17"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Individual limits</tspan></text><text class="" x="1144" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Association does not prove a</tspan><tspan x="1144" dy="31">specific developmental defect.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">Rare-gene examples belong to the rare-variant source, not the 2023 GWAS.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Numbered boxes are comparison points; no causal arrows implied.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: S02, S04 · Scope and full references accompany this diagram.</tspan></text></svg>