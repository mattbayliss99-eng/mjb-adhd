<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><title>Just two minutes</title><desc>Original two-panel meme: a clock labelled 10:00 becomes 12:00. Text: Me: Just two minutes. Time: That was a suggestion.</desc><rect width="1000" height="640" fill="#080d0a"/><rect x="24" y="24" width="952" height="592" rx="24" fill="#101a14" stroke="#3c6b49" stroke-width="2"/><text x="52" y="72" fill="#78eaa0" font-family="sans-serif" font-size="19">MJB ADHD · ORIGINAL RELATABLE EXAMPLE</text><text x="52" y="140" fill="#eff6ed" font-family="sans-serif" font-size="36" font-weight="700">ME: Just two minutes.</text><path d="M52 319h896" stroke="#3c6b49" stroke-width="2"/><text x="52" y="382" fill="#eff6ed" font-family="sans-serif" font-size="36" font-weight="700">TIME: That was a suggestion.</text><circle cx="93" cy="217" r="42" fill="none" stroke="#78eaa0" stroke-width="5"/><path d="M93 190v27l22 12" stroke="#78eaa0" stroke-width="5" fill="none"/><text x="163" y="230" fill="#eff6ed" font-family="sans-serif" font-size="46">10:00</text><circle cx="93" cy="487" r="42" fill="none" stroke="#78eaa0" stroke-width="5"/><path d="M93 460v27l22 12" stroke="#78eaa0" stroke-width="5" fill="none"/><text x="163" y="500" fill="#eff6ed" font-family="sans-serif" font-size="46">12:00</text><text x="52" y="584" fill="#aac2b0" font-family="sans-serif" font-size="18">Illustration of experience · not a diagnostic test or biological mechanism</text></svg>