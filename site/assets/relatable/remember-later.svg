<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><title>I will remember that</title><desc>Original two-panel meme: a note labelled Remember this, then an empty note with a question mark. Text: Me: I will remember that. Brain: Remember what?</desc><rect width="1000" height="640" fill="#080d0a"/><rect x="24" y="24" width="952" height="592" rx="24" fill="#101a14" stroke="#3c6b49" stroke-width="2"/><text x="52" y="72" fill="#78eaa0" font-family="sans-serif" font-size="19">MJB ADHD · ORIGINAL RELATABLE EXAMPLE</text><text x="52" y="140" fill="#eff6ed" font-family="sans-serif" font-size="36" font-weight="700">ME: I will remember that.</text><path d="M52 319h896" stroke="#3c6b49" stroke-width="2"/><text x="52" y="382" fill="#eff6ed" font-family="sans-serif" font-size="36" font-weight="700">BRAIN: Remember what?</text><rect x="54" y="182" width="500" height="106" rx="12" fill="#263c2e" stroke="#78eaa0"/><text x="84" y="248" fill="#eff6ed" font-family="sans-serif" font-size="33">REMEMBER THIS</text><rect x="54" y="426" width="500" height="106" rx="12" fill="#263c2e" stroke="#78eaa0"/><text x="84" y="492" fill="#eff6ed" font-family="sans-serif" font-size="33">?</text><text x="52" y="584" fill="#aac2b0" font-family="sans-serif" font-size="18">Illustration of experience · not a diagnostic test or biological mechanism</text></svg>