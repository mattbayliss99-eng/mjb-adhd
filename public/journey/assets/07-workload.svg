<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">The patient had to coordinate.</title><desc id="desc">The mailbox audit found 4,356 retained sent-folder message records from 1 January to 12 October 2026 across two accounts: 2,368 personal and 1,988 advocacy. This includes wider correspondence and is not a care-only or unique-recipient count. Matthew describes coordinating evidence, complaints, referrals and private treatment while disabled by pain and impaired executive function.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">07 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">The patient had to</text><text x="64" y="273.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">coordinate.</text><text x="64" y="346.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">The workload was part of the crisis.</text><text x="64" y="525.5" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="150" font-weight="700">4,356</text><text x="64" y="609.49" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700">Sent-folder message records across two</text><text x="64" y="659.49" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700">accounts in 2026.</text><text x="64" y="734.76" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">2,368 personal + 1,988 advocacy</text><text x="64" y="809.12" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="400">1 January–12 October. Includes wider correspondence,</text><text x="64" y="850.12" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="400">outreach, forwards and follow-ups; not all care-seeking</text><text x="64" y="891.12" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="400">emails.</text><text x="64" y="973.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="400">I organised evidence, referrals, complaints and</text><text x="64" y="1019.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="400">private care while pain and ADHD impaired my</text><text x="64" y="1065.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="400">capacity to do it.</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">This should not be a condition of getting care.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Completed mailbox pagination [A01] • Patient account</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>