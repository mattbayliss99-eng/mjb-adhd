<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">I secured the private route.</title><desc id="desc">MJB personal update. After approximately five years of ADHD treatment and ten months without continuity, ADHD Direct confirmed the private Amfexa prescription was sent on 12 October 2026. No completed NHS prescribing handover is evidenced in this review. Delivery, dispensing and recovery remain unconfirmed.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">01 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">I secured the private</text><text x="64" y="273.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">route.</text><text x="64" y="346.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">Five years treated. About ten months without continuity.</text><rect x="64" y="389" width="952" height="230" rx="20" fill="#122027"/><text x="90" y="432.66" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">12 OCTOBER 2026</text><text x="90" y="483.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">ADHD Direct confirmed my Amfexa prescription was</text><text x="90" y="524.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">processed and posted.</text><rect x="64" y="644" width="952" height="260" rx="20" fill="#122027"/><text x="90" y="687.66" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">THE OUTCOME</text><text x="90" y="738.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">A private prescription sent. No completed NHS</text><text x="90" y="779.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">prescribing handover evidenced in this review.</text><text x="64" y="969.94" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Delivery, dispensing and recovery are still to be</text><text x="64" y="1013.94" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">confirmed.</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">Next: recovery, accountability and change.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Case: C01, C06, C10 • First-person account</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>