<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Close the loop.</title><desc id="desc">MJB proposes six continuity safeguards: named decision-maker, accepted receiving service, interim plan, consideration of treatment and delay risks, review and escalation date, and an accessible written decision. NICE NG87 recommendation 1.5.1 supports continuity of care. The safeguards are proposals, not a statutory entitlement to a particular prescription.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">08 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">Close the loop.</text><text x="64" y="268.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">MJB proposed continuity safeguards</text><text x="64" y="342.85" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">01</text><text x="142" y="343.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">A named decision-maker.</text><text x="64" y="433.85" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">02</text><text x="142" y="434.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">An accepted receiving service.</text><text x="64" y="524.85" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">03</text><text x="142" y="525.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">A workable interim plan.</text><text x="64" y="615.85" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">04</text><text x="142" y="616.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Risks of treatment AND delay.</text><text x="64" y="706.85" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">05</text><text x="142" y="707.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">A review date and escalation route.</text><text x="64" y="797.85" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">06</text><text x="142" y="798.76" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">An accessible written decision.</text><text x="64" y="925.94" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">A referral is not a completed transfer until</text><text x="64" y="969.94" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">responsibility is accepted, or an appropriate</text><text x="64" y="1013.94" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">alternative is documented.</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">Measure patient outcomes, not just referrals.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">NICE NG87 1.5.1 [P15] • MJB design proposal</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>