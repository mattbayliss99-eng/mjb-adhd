<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">An investigation needs an outcome.</title><desc id="desc">Ministry of Justice data show 35,989 inquests opened and 654 Prevention of Future Deaths reports issued in England and Wales in 2025, across all causes. MJB asks who verifies resulting safety changes. Neither total measures mental-health-only events or proved NHS negligence.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">03 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">An investigation needs</text><text x="64" y="273.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">an outcome.</text><text x="64" y="346.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">England and Wales • Calendar 2025 • ALL CAUSES</text><rect x="64" y="389" width="952" height="280" rx="20" fill="#122027"/><text x="90" y="432.66" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">ALL CAUSES</text><text x="90" y="548.55" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="105" font-weight="700">35,989</text><text x="90" y="613.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Inquests opened.</text><rect x="64" y="693" width="952" height="300" rx="20" fill="#122027"/><text x="90" y="736.66" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">ALL CAUSES</text><text x="90" y="852.55" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="105" font-weight="700">654</text><text x="90" y="917.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Prevention of Future Deaths reports issued.</text><text x="64" y="1060.85" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">Who checks that the required response leads</text><text x="64" y="1105.85" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">to a verified safety change?</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">These are not NHS or mental-health-only totals.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Ministry of Justice, Coroners Statistics 2025 [P01]</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>