<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">Vesicle filling and ATP supply</title>
  <desc id="desc">Original explanatory schematic, not to scale. On the left, a vesicle membrane. V-ATPase sits in that membrane, uses ATP, and pumps H+ from the cytosol into the lumen. VMAT2, also in the vesicle membrane, moves monoamine into the lumen coupled to H+ moving out. On the right, a separate mitochondrion shows the outer membrane, intermembrane space, inner membrane and matrix. ATP synthase is on the inner membrane. H+ returns from the intermembrane space into the matrix through ATP synthase. Glycolysis and the mitochondrion both contribute ATP in the cytosol. No proton arrow joins the vesicle and the mitochondrion.</desc>
  <rect width="980" height="640" fill="#14110c"/>
  <text x="36" y="40" fill="#e6d7a8" font-family="Georgia, serif" font-size="22">Vesicle membrane</text>
  <text x="520" y="40" fill="#e6d7a8" font-family="Georgia, serif" font-size="22">Mitochondrion — separate membranes</text>
  <text x="36" y="78" fill="#c9a227" font-family="Georgia, serif" font-size="16">Cytosol</text>
  <ellipse cx="250" cy="280" rx="190" ry="145" fill="#1a160f" stroke="#e6d7a8" stroke-width="3"/>
  <text x="110" y="300" fill="#f4ebd4" font-family="Georgia, serif" font-size="18">Lumen</text>
  <rect x="196" y="118" width="108" height="34" rx="6" fill="#14110c" stroke="#c9a227" stroke-width="2"/>
  <line x1="304" y1="135" x2="322" y2="135" stroke="#e6d7a8" stroke-width="1.5"/>
  <text x="328" y="140" fill="#f4ebd4" font-family="Georgia, serif" font-size="15">V-ATPase</text>
  <text x="70" y="112" fill="#f4ebd4" font-family="Georgia, serif" font-size="15">ATP used</text>
  <path d="M148 128h44" stroke="#f4ebd4" stroke-width="2" marker-end="url(#cream)"/>
  <path d="M250 90v90" stroke="#c9a227" stroke-width="2.5" marker-end="url(#gold)"/>
  <text x="262" y="104" fill="#c9a227" font-family="Georgia, serif" font-size="16">H+</text>
  <text x="268" y="168" fill="#c9a227" font-family="Georgia, serif" font-size="14">into lumen</text>
  <rect x="400" y="228" width="80" height="88" rx="8" fill="#14110c" stroke="#e6d7a8" stroke-width="2"/>
  <text x="412" y="278" fill="#f4ebd4" font-family="Georgia, serif" font-size="14">VMAT2</text>
  <path d="M560 246H300" stroke="#f4ebd4" stroke-width="2.5" marker-end="url(#cream)"/>
  <text x="488" y="234" fill="#f4ebd4" font-family="Georgia, serif" font-size="14">Monoamine in</text>
  <path d="M280 296h280" stroke="#c9a227" stroke-width="2.5" marker-end="url(#gold)"/>
  <text x="500" y="336" fill="#c9a227" font-family="Georgia, serif" font-size="14">H+ out</text>
  <ellipse cx="770" cy="270" rx="165" ry="150" fill="none" stroke="#8d7b52" stroke-width="3"/>
  <ellipse cx="770" cy="270" rx="108" ry="96" fill="#1a160f" stroke="#e6d7a8" stroke-width="2.5"/>
  <text x="648" y="108" fill="#8d7b52" font-family="Georgia, serif" font-size="14">Outer membrane</text>
  <text x="688" y="168" fill="#c9a227" font-family="Georgia, serif" font-size="13">Intermembrane space</text>
  <text x="730" y="188" fill="#e6d7a8" font-family="Georgia, serif" font-size="13">Inner membrane</text>
  <text x="736" y="268" fill="#f4ebd4" font-family="Georgia, serif" font-size="16">Matrix</text>
  <rect x="720" y="348" width="116" height="36" rx="6" fill="#14110c" stroke="#c9a227" stroke-width="2"/>
  <line x1="720" y1="366" x2="700" y2="392" stroke="#e6d7a8" stroke-width="1.5"/>
  <text x="568" y="406" fill="#f4ebd4" font-family="Georgia, serif" font-size="14">ATP synthase</text>
  <path d="M808 414V312" stroke="#c9a227" stroke-width="2.5" marker-end="url(#gold)"/>
  <text x="818" y="404" fill="#c9a227" font-family="Georgia, serif" font-size="14">H+ to matrix</text>
  <path d="M760 336H560" stroke="#f4ebd4" stroke-width="2.5" marker-end="url(#cream)"/>
  <text x="590" y="326" fill="#f4ebd4" font-family="Georgia, serif" font-size="14">ATP</text>
  <rect x="390" y="470" width="130" height="32" rx="6" fill="#14110c" stroke="#f4ebd4" stroke-width="1.5"/>
  <text x="412" y="491" fill="#f4ebd4" font-family="Georgia, serif" font-size="15">Glycolysis</text>
  <path d="M455 470v-28" stroke="#f4ebd4" stroke-width="2" marker-end="url(#cream)"/>
  <text x="464" y="452" fill="#f4ebd4" font-family="Georgia, serif" font-size="14">ATP</text>
  <text x="180" y="540" fill="#e6d7a8" font-family="Georgia, serif" font-size="15">ATP in the cytosol connects the systems. No proton arrow joins them.</text>
  <text x="28" y="600" fill="#c9a227" font-family="Georgia, serif" font-size="15">Original explanatory schematic; not to scale. Vesicle filling and ATP supply involve separate membrane systems.</text>
  <defs>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#c9a227"/>
    </marker>
    <marker id="cream" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#f4ebd4"/>
    </marker>
  </defs>
</svg>
