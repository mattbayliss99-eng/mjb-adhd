<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><title>The missing start button</title><desc>Original two-panel meme: a clear task plan beside a waiting start button. Text: The plan: Start the thing. The start button: Please wait.</desc><rect width="1000" height="640" fill="#080d0a"/><rect x="24" y="24" width="952" height="592" rx="24" fill="#101a14" stroke="#3c6b49" stroke-width="2"/><text x="52" y="72" fill="#78eaa0" font-family="sans-serif" font-size="19">MJB ADHD · ORIGINAL RELATABLE EXAMPLE</text><text x="52" y="140" fill="#eff6ed" font-family="sans-serif" font-size="36" font-weight="700">THE PLAN: Start the thing.</text><path d="M52 319h896" stroke="#3c6b49" stroke-width="2"/><text x="52" y="382" fill="#eff6ed" font-family="sans-serif" font-size="36" font-weight="700">THE START BUTTON: Please wait.</text><path d="M74 213l18 18 34-42" stroke="#78eaa0" stroke-width="8" fill="none"/><text x="158" y="230" fill="#eff6ed" font-family="sans-serif" font-size="27">Task understood. Intention present.</text><rect x="55" y="426" width="440" height="106" rx="20" fill="#263c2e" stroke="#78eaa0"/><text x="95" y="493" fill="#b9c9bc" font-family="sans-serif" font-size="33">START ... loading</text><text x="52" y="584" fill="#aac2b0" font-family="sans-serif" font-size="18">Illustration of experience · not a diagnostic test or biological mechanism</text></svg>