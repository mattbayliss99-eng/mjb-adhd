<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" font-family="DejaVu Sans,sans-serif"><title id="title">Mitochondrial quality control: one mitophagy route</title><desc id="desc">PINK1–PRKN-dependent mitophagy is a studied selective-removal route for damaged mitochondria. Loss of membrane potential can lead to PINK1 accumulation, phosphorylation of ubiquitin and PRKN activation, cargo recruitment and autophagy followed by lysosomal breakdown. Protein quality control and mitochondrial maintenance have other pathways too. This example does not assert that SPG7 is the same pathway, that a personal variant is pathogenic, or that quality-control failure explains ordinary ADHD.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#45646e"/></marker></defs><rect width="1600" height="1080" fill="#fbfcf8"/><rect width="1600" height="10" fill="#28705e"/><text class="" x="60" y="61" font-size="21" font-weight="700" fill="#29705e"><tspan x="60" dy="0">MJB ADHD / PROCESS ATLAS · F26</tspan></text><text class="" x="60" y="120" font-size="38" font-weight="700" fill="#182e38"><tspan x="60" dy="0">Mitochondrial quality control: one mitophagy route</tspan></text><text class="" x="60" y="172" font-size="24" font-weight="400" fill="#182e38"><tspan x="60" dy="0">One mitochondrial quality-control pathway: PINK1–PRKN mitophagy.</tspan></text><path d="M488 355.0H578" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="487.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="487.0" dy="0">PINK1</tspan></text><path d="M1018 355.0H1108" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="322.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">PRKN</tspan><tspan x="1017.0" dy="22">activation</tspan></text><path d="M1330.0 478V558" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1346.0" y="510.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1346.0" dy="0">cargo receptors</tspan></text><path d="M1112 685.0H1022" fill="none" stroke="#45646e" stroke-width="3" marker-end="url(#arrow)"/><text class="edge-label" x="1017.0" y="652.0" font-size="16" font-weight="400" fill="#34565f"><tspan x="1017.0" dy="0">autophagy</tspan></text><g class="atlas-node" data-node="1"><rect class="node-box" x="60" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="90" cy="271" r="15" fill="#29705e"/><text x="90" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text><text class="" x="116" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Membrane potential</tspan><tspan x="116" dy="34">loss</tspan></text><text class="" x="84" y="350" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">In this studied route, impaired</tspan><tspan x="84" dy="31">import permits PINK1</tspan><tspan x="84" dy="31">accumulation.</tspan></text></g><g class="atlas-node" data-node="2"><rect class="node-box" x="590" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="271" r="15" fill="#29705e"/><text x="620" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text><text class="" x="646" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">PINK1 at outer</tspan><tspan x="646" dy="34">membrane</tspan></text><text class="" x="614" y="350" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">PINK1 phosphorylation supports</tspan><tspan x="614" dy="31">ubiquitin / PRKN signalling.</tspan></text></g><g class="atlas-node" data-node="3"><rect class="node-box" x="1120" y="240" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="271" r="15" fill="#29705e"/><text x="1150" y="277" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text><text class="" x="1176" y="278" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Ubiquitin tagging</tspan></text><text class="" x="1144" y="316" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Activated PRKN promotes</tspan><tspan x="1144" dy="31">tagging of outer-membrane</tspan><tspan x="1144" dy="31">substrates.</tspan></text></g><g class="atlas-node" data-node="4"><rect class="node-box" x="1120" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="1150" cy="601" r="15" fill="#29705e"/><text x="1150" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text><text class="" x="1176" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="1176" dy="0">Cargo recruitment</tspan></text><text class="" x="1144" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="1144" dy="0">Receptors connect tagged</tspan><tspan x="1144" dy="31">material to autophagy</tspan><tspan x="1144" dy="31">machinery.</tspan></text></g><g class="atlas-node" data-node="5"><rect class="node-box" x="590" y="570" width="420" height="230" rx="18" fill="#eaf4ee" stroke="#29705e" stroke-width="2"/><circle cx="620" cy="601" r="15" fill="#29705e"/><text x="620" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text><text class="" x="646" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="646" dy="0">Lysosomal degradation</tspan></text><text class="" x="614" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="614" dy="0">Autophagosome fusion</tspan><tspan x="614" dy="31">supports breakdown of</tspan><tspan x="614" dy="31">damaged material.</tspan></text></g><g class="atlas-node" data-node="6"><rect class="node-box" x="60" y="570" width="420" height="230" rx="18" fill="#fff4db" stroke="#9c6a17" stroke-width="2"/><circle cx="90" cy="601" r="15" fill="#9c6a17"/><text x="90" y="607" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text><text class="" x="116" y="608" font-size="25" font-weight="700" fill="#182e38"><tspan x="116" dy="0">Scope of the example</tspan></text><text class="" x="84" y="646" font-size="23" font-weight="400" fill="#182e38"><tspan x="84" dy="0">Other quality-control and</tspan><tspan x="84" dy="31">mitophagy routes exist.</tspan></text></g><rect x="60" y="836" width="1480" height="129" rx="16" fill="#e8f1ed"/><text class="" x="84" y="871" font-size="18" font-weight="700" fill="#29705e"><tspan x="84" dy="0">KEEP THE DISTINCTION</tspan></text><text class="" x="84" y="914" font-size="27" font-weight="700" fill="#182e38"><tspan x="84" dy="0">A normal quality-control pathway does not establish an ADHD mechanism.</tspan></text><text class="" x="60" y="1003" font-size="20" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Arrows: the labelled process or relationship; omitted steps are explained below the image.</tspan></text><text class="" x="60" y="1045" font-size="18" font-weight="400" fill="#49626a"><tspan x="60" dy="0">Sources: N-MITOPHAGY · Scope and full references accompany this diagram.</tspan></text></svg>