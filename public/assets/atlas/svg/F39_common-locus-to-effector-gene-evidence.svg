<text x="800.0" y="62" font-size="38" font-weight="500" fill="#1E2633" text-anchor="middle">Common locus to effector gene: evidence chain</text><text x="800.0" y="94" font-size="17" fill="#4A5463" text-anchor="middle">Each transition needs its own evidence; uncertainty accumulates along the chain</text><rect x="560" y="700" width="480" height="110" rx="14" fill="#FFF6F5" stroke="#E3A7A4" stroke-width="1.6" stroke-dasharray="8 6"/><path d="M 258.0 330.0 L 302.0 330.0" fill="none" stroke="#3C4554" stroke-width="2" marker-end="url(#arr)"/><path d="M 518.0 330.0 L 562.0 330.0" fill="none" stroke="#3C4554" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><path d="M 778.0 330.0 L 822.0 330.0" fill="none" stroke="#3C4554" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><path d="M 1038.0 330.0 L 1082.0 330.0" fill="none" stroke="#3C4554" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><path d="M 1298.0 330.0 L 1342.0 330.0" fill="none" stroke="#3C4554" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><defs><linearGradient id="unc" x1="0" x2="1"><stop offset="0" stop-color="#EADCF0" stop-opacity="0.25"/><stop offset="1" stop-color="#8E64A6" stop-opacity="0.9"/></linearGradient></defs><rect x="60" y="190" width="1480" height="16" rx="8" fill="url(#unc)"/><text x="60" y="180" font-size="14" fill="#4A5463">uncertainty accumulates →</text><path d="M 410.0 383.0 L 410.0 577.0" fill="none" stroke="#3C4554" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="462.0" y="484.9" font-size="14" fill="#1E2633" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"><tspan x="462.0" dy="0.0">side branch</tspan></text><path d="M 1190.0 383.0 L 1190.0 577.0" fill="none" stroke="#3C4554" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="1242.0" y="484.9" font-size="14" fill="#1E2633" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"><tspan x="1242.0" dy="0.0">side branch</tspan></text><rect x="45.0" y="280.0" width="210" height="100" rx="10" fill="#DCE6F5" stroke="#5F82B8" stroke-width="2"/><text x="150" y="316.9" font-size="15" fill="#1E2633" text-anchor="middle" font-weight="600"><tspan x="150" dy="0.0">Associated</tspan><tspan x="150" dy="18.3">genomic locus</tspan><tspan x="150" dy="18.3">(GWAS signal)</tspan></text><rect x="305.0" y="280.0" width="210" height="100" rx="10" fill="#DCE6F5" stroke="#5F82B8" stroke-width="2"/><text x="410" y="326.1" font-size="15" fill="#1E2633" text-anchor="middle"><tspan x="410" dy="0.0">Fine mapping</tspan><tspan x="410" dy="18.3">(credible set)</tspan></text><rect x="565.0" y="280.0" width="210" height="100" rx="10" fill="#EADCF0" stroke="#8E64A6" stroke-width="2"/><text x="670" y="326.1" font-size="15" fill="#1E2633" text-anchor="middle"><tspan x="670" dy="0.0">Candidate</tspan><tspan x="670" dy="18.3">causal variant(s)</tspan></text><rect x="825.0" y="280.0" width="210" height="100" rx="10" fill="#EADCF0" stroke="#8E64A6" stroke-width="2"/><text x="930" y="326.1" font-size="15" fill="#1E2633" text-anchor="middle"><tspan x="930" dy="0.0">Consequence</tspan><tspan x="930" dy="18.3">regulatory or coding</tspan></text><rect x="1085.0" y="280.0" width="210" height="100" rx="10" fill="#D3ECE8" stroke="#3E8F86" stroke-width="2"/><text x="1190" y="326.1" font-size="15" fill="#1E2633" text-anchor="middle" font-weight="600"><tspan x="1190" dy="0.0">Candidate</tspan><tspan x="1190" dy="18.3">effector gene</tspan></text><rect x="1345.0" y="280.0" width="210" height="100" rx="10" fill="#D3ECE8" stroke="#3E8F86" stroke-width="2"/><text x="1450" y="326.1" font-size="15" fill="#1E2633" text-anchor="middle"><tspan x="1450" dy="0.0">Tissue-specific</tspan><tspan x="1450" dy="18.3">process</tspan></text><rect x="265.0" y="580.0" width="290" height="80" rx="10" fill="#FFFFFF" stroke="#9AA1AC" stroke-width="2" stroke-dasharray="7 5"/><text x="410" y="607.8" font-size="14" fill="#1E2633" text-anchor="middle"><tspan x="410" dy="0.0">Linkage disequilibrium:</tspan><tspan x="410" dy="17.1">many correlated variants</tspan><tspan x="410" dy="17.1">share the signal</tspan></text><rect x="1045.0" y="580.0" width="290" height="80" rx="10" fill="#FFFFFF" stroke="#9AA1AC" stroke-width="2" stroke-dasharray="7 5"/><text x="1190" y="607.8" font-size="14" fill="#1E2633" text-anchor="middle"><tspan x="1190" dy="0.0">Alternative genes in</tspan><tspan x="1190" dy="17.1">the locus (regulation can</tspan><tspan x="1190" dy="17.1">act at a distance)</tspan></text><text x="280.0" y="416.6" font-size="13" fill="#4A5463" text-anchor="middle" font-style="italic"><tspan x="280.0" dy="0.0">statistical</tspan><tspan x="280.0" dy="15.9">association</tspan></text><text x="540.0" y="416.6" font-size="13" fill="#4A5463" text-anchor="middle" font-style="italic"><tspan x="540.0" dy="0.0">posterior</tspan><tspan x="540.0" dy="15.9">probability</tspan></text><text x="800.0" y="416.6" font-size="13" fill="#4A5463" text-anchor="middle" font-style="italic"><tspan x="800.0" dy="0.0">functional</tspan><tspan x="800.0" dy="15.9">annotation</tspan></text><text x="1060.0" y="416.6" font-size="13" fill="#4A5463" text-anchor="middle" font-style="italic"><tspan x="1060.0" dy="0.0">QTL colocalisation,</tspan><tspan x="1060.0" dy="15.9">chromatin contact</tspan></text><text x="1320.0" y="416.6" font-size="13" fill="#4A5463" text-anchor="middle" font-style="italic"><tspan x="1320.0" dy="0.0">expression and</tspan><tspan x="1320.0" dy="15.9">function in tissue</tspan></text><text x="800" y="741.3" font-size="18" fill="#C0504D" text-anchor="middle" font-weight="600"><tspan x="800" dy="0.0">Nearest does not mean causal</tspan></text><text x="800" y="779.9" font-size="14" fill="#7A3E8E" text-anchor="middle"><tspan x="800" dy="0.0">Proximity alone does not establish the effector gene.</tspan></text><text x="40" y="700" font-size="14" font-weight="600" fill="#4A5463">Key</text><rect x="40" y="712" width="22" height="14" rx="4" fill="#DCE6F5" stroke="#5F82B8" stroke-width="1.5"/><text x="70" y="724" font-size="13" fill="#4A5463">supply</text><rect x="40" y="734" width="22" height="14" rx="4" fill="#D3ECE8" stroke="#3E8F86" stroke-width="1.5"/><text x="70" y="746" font-size="13" fill="#4A5463">signalling</text><rect x="40" y="756" width="22" height="14" rx="4" fill="#EADCF0" stroke="#8E64A6" stroke-width="1.5"/><text x="70" y="768" font-size="13" fill="#4A5463">regulation</text><line x1="40" y1="785" x2="62" y2="785" stroke="#3C4554" stroke-width="2"/><text x="70" y="790" font-size="13" fill="#4A5463">established step</text><line x1="40" y1="807" x2="62" y2="807" stroke="#3C4554" stroke-width="2" stroke-dasharray="6 4"/><text x="70" y="812" font-size="13" fill="#4A5463">inferred / uncertain step</text><text x="1576" y="882" font-size="12" fill="#8A93A0" text-anchor="end">MJB ADHD Process Atlas · F39 · educational schematic, not a diagnostic model</text></svg>