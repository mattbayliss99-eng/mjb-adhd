<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="t d" font-family="DejaVu Sans,sans-serif"><title id="t">Make a handover visible</title><desc id="d">A practical checklist for following a referral or transfer; ask the service which process applies. This is a record-organising tool, not a declaration that every referral guarantees treatment. Ask for the actual status and next decision.</desc><rect width="1440" height="850" fill="#0d1713"/><rect width="1440" height="9" fill="#79e8ab"/><text x="54" y="60" fill="#79e8ab" font-size="20" font-weight="700">MJB ADHD / A USEFUL VISUAL</text><text x="54" y="123" fill="#f1f8f3" font-size="42" font-weight="700">Make a handover visible</text><text x="54" y="180" font-size="25" fill="#f1f8f3" font-weight="400"><tspan x="54" dy="0">A practical checklist for following a referral or transfer; ask the service which process applies.</tspan></text><rect x="54" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="88" cy="306" r="19" fill="#79e8ab"/><text x="88" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">1</text><text x="78" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="78" dy="0">The sender</tspan></text><text x="78" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="78" dy="0">What was sent, when and to</tspan><tspan x="78" dy="36.4">whom?</tspan></text><text x="78" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="78" dy="0">Keep the referral, summary and</tspan><tspan x="78" dy="32.199999999999996">reference.</tspan></text><rect x="506" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="540" cy="306" r="19" fill="#79e8ab"/><text x="540" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">2</text><text x="530" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="530" dy="0">The receiver</tspan></text><text x="530" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="530" dy="0">Was it received and</tspan><tspan x="530" dy="36.4">accepted?</tspan></text><text x="530" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="530" dy="0">Separate delivery, triage,</tspan><tspan x="530" dy="32.199999999999996">acceptance and responsibility.</tspan></text><rect x="958" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="992" cy="306" r="19" fill="#79e8ab"/><text x="992" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">3</text><text x="982" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="982" dy="0">The next action</tspan></text><text x="982" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="982" dy="0">Who does what, by when?</tspan></text><text x="982" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="982" dy="0">Record the plan, contact and</tspan><tspan x="982" dy="32.199999999999996">how an overdue action is</tspan><tspan x="982" dy="32.199999999999996">escalated.</tspan></text><rect x="54" y="657" width="1332" height="127" rx="18" fill="#223b2e"/><text x="78" y="704" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="78" dy="0">A sent message is not the same event as an accepted handover or a completed action.</tspan></text><text x="54" y="828" fill="#9bbbaa" font-size="18">Original MJB illustration · practical explanation · open the related page for detail</text></svg>