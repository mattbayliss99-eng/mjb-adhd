<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="t d" font-family="DejaVu Sans,sans-serif"><title id="t">Browse, search and keep your place</title><desc id="d">Three routes through this website, with the current section always visible. The menu and breadcrumb work together. On larger screens you can pin the explorer; on a phone it opens as a drawer.</desc><rect width="1440" height="850" fill="#0d1713"/><rect width="1440" height="9" fill="#79e8ab"/><text x="54" y="60" fill="#79e8ab" font-size="20" font-weight="700">MJB ADHD / A USEFUL VISUAL</text><text x="54" y="123" fill="#f1f8f3" font-size="42" font-weight="700">Browse, search and keep your place</text><text x="54" y="180" font-size="25" fill="#f1f8f3" font-weight="400"><tspan x="54" dy="0">Three routes through this website, with the current section always visible.</tspan></text><rect x="54" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="88" cy="306" r="19" fill="#79e8ab"/><text x="88" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">1</text><text x="78" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="78" dy="0">Browse by topic</tspan></text><text x="78" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="78" dy="0">Open the menu, then</tspan><tspan x="78" dy="36.4">choose a category.</tspan></text><text x="78" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="78" dy="0">Only the selected branch opens;</tspan><tspan x="78" dy="32.199999999999996">the current page is marked.</tspan></text><rect x="506" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="540" cy="306" r="19" fill="#79e8ab"/><text x="540" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">2</text><text x="530" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="530" dy="0">Search a specific term</tspan></text><text x="530" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="530" dy="0">Use search when you know</tspan><tspan x="530" dy="36.4">the word or phrase.</tspan></text><text x="530" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="530" dy="0">Results include the section path</tspan><tspan x="530" dy="32.199999999999996">as well as the title.</tspan></text><rect x="958" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="992" cy="306" r="19" fill="#79e8ab"/><text x="992" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">3</text><text x="982" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="982" dy="0">Move through parents</tspan></text><text x="982" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="982" dy="0">Use the location path or</tspan><tspan x="982" dy="36.4">optional desktop sidebar.</tspan></text><text x="982" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="982" dy="0">Return to a parent section</tspan><tspan x="982" dy="32.199999999999996">without retracing every link.</tspan></text><rect x="54" y="657" width="1332" height="127" rx="18" fill="#223b2e"/><text x="78" y="704" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="78" dy="0">The location path describes the topic hierarchy, not your private browsing history.</tspan></text><text x="54" y="828" fill="#9bbbaa" font-size="18">Original MJB illustration · practical explanation · open the related page for detail</text></svg>