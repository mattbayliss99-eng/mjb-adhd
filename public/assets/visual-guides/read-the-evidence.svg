<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="t d" font-family="DejaVu Sans,sans-serif"><title id="t">Three different evidence questions</title><desc id="d">A mechanism, an association and an individual conclusion are different kinds of evidence. Use the question to recognise the scope of a claim. A normal pathway does not prove a defect; an association does not prove an individual cause.</desc><rect width="1440" height="850" fill="#0d1713"/><rect width="1440" height="9" fill="#79e8ab"/><text x="54" y="60" fill="#79e8ab" font-size="20" font-weight="700">MJB ADHD / A USEFUL VISUAL</text><text x="54" y="123" fill="#f1f8f3" font-size="42" font-weight="700">Three different evidence questions</text><text x="54" y="180" font-size="25" fill="#f1f8f3" font-weight="400"><tspan x="54" dy="0">A mechanism, an association and an individual conclusion are different kinds of evidence.</tspan></text><rect x="54" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="88" cy="306" r="19" fill="#79e8ab"/><text x="88" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">1</text><text x="78" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="78" dy="0">Mechanism</tspan></text><text x="78" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="78" dy="0">How can a biological process</tspan><tspan x="78" dy="36.4">work?</tspan></text><text x="78" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="78" dy="0">Enzymes, transporters, cells and</tspan><tspan x="78" dy="32.199999999999996">model experiments.</tspan></text><rect x="506" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="540" cy="306" r="19" fill="#79e8ab"/><text x="540" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">2</text><text x="530" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="530" dy="0">Association</tspan></text><text x="530" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="530" dy="0">What varies together in a</tspan><tspan x="530" dy="36.4">study?</tspan></text><text x="530" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="530" dy="0">A statistical result needs its</tspan><tspan x="530" dy="32.199999999999996">sample, effect and uncertainty.</tspan></text><rect x="958" y="265" width="426" height="342" rx="20" fill="#183026" stroke="#4f9773" stroke-width="2"/><circle cx="992" cy="306" r="19" fill="#79e8ab"/><text x="992" y="314" text-anchor="middle" fill="#0d1713" font-size="23" font-weight="700">3</text><text x="982" y="369" font-size="29" fill="#79e8ab" font-weight="700"><tspan x="982" dy="0">Individual conclusion</tspan></text><text x="982" y="432" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="982" dy="0">What does this mean for this</tspan><tspan x="982" dy="36.4">person?</tspan></text><text x="982" y="523" font-size="23" fill="#c4d9cc" font-weight="400"><tspan x="982" dy="0">Clinical and genetic</tspan><tspan x="982" dy="32.199999999999996">interpretation needs additional</tspan><tspan x="982" dy="32.199999999999996">evidence.</tspan></text><rect x="54" y="657" width="1332" height="127" rx="18" fill="#223b2e"/><text x="78" y="704" font-size="26" fill="#f1f8f3" font-weight="400"><tspan x="78" dy="0">A connection between these questions needs evidence; it is not automatic.</tspan></text><text x="54" y="828" fill="#9bbbaa" font-size="18">Original MJB illustration · practical explanation · open the related page for detail</text></svg>