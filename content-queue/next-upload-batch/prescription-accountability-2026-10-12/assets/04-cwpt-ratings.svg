<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">CWPT: mixed ratings.</title><desc id="desc">CQC rated CWPT trust-level Well-led as Good, published 26 August 2026. Adult community mental-health Safe and Responsive were Requires improvement, published 15 July 2026. Positive findings and concerns coexist. These are service and leadership assessments, not an adjudication of Matthew’s ADHD prescribing decision.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">04 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">CWPT: mixed ratings.</text><text x="64" y="268.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">Different assessment levels must stay distinct.</text><rect x="64" y="311" width="952" height="190" rx="20" fill="#122027"/><text x="90" y="354.66" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">TRUST-LEVEL WELL-LED</text><text x="90" y="405.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">GOOD</text><text x="90" y="472.48" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400">Published 26 August 2026</text><rect x="64" y="526" width="952" height="260" rx="20" fill="#122027"/><text x="90" y="569.66" fill="#ffc778" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">ADULT COMMUNITY MENTAL HEALTH</text><text x="90" y="620.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Safe: Requires improvement</text><text x="90" y="661.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Responsive: Requires improvement</text><text x="90" y="764.48" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400">Published 15 July 2026</text><text x="64" y="860.85" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400">Medicines and continuity concerns sit alongside</text><text x="64" y="905.85" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400">positive findings. These ratings do not decide my</text><text x="64" y="950.85" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400">ADHD case.</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">A rating is not a completed handover.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">CQC CWPT reports [P07–P09]</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>