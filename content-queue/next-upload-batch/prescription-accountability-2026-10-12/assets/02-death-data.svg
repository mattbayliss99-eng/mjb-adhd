<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Deaths: keep the scope visible.</title><desc id="desc">183 deaths of people subject to Mental Health Act detention were reported to coroners in England and Wales in calendar 2025. Separately, CQC received 314 death notifications in England in financial year 2024/25, comprising 253 detained patients and 61 people subject to community treatment orders. The totals are not additive and neither establishes preventability.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">02 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">Deaths: keep the scope</text><text x="64" y="273.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">visible.</text><text x="64" y="346.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">Two different official reporting series.</text><rect x="64" y="389" width="952" height="310" rx="20" fill="#122027"/><text x="90" y="432.66" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">CALENDAR 2025 • ENGLAND AND WALES</text><text x="90" y="548.55" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="105" font-weight="700">183</text><text x="90" y="613.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Deaths of people subject to Mental Health Act</text><text x="90" y="654.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">detention reported to coroners.</text><rect x="64" y="724" width="952" height="330" rx="20" fill="#122027"/><text x="90" y="767.66" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">FINANCIAL 2024/25 • ENGLAND</text><text x="90" y="883.55" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="105" font-weight="700">314</text><text x="90" y="948.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">CQC death notifications: 253 detained patients + 61</text><text x="90" y="989.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">people subject to community treatment orders.</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">Do not add them. Neither is an avoidable-death</text><text x="64" y="1219.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">count.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Ministry of Justice [P01] • CQC [P02]</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>