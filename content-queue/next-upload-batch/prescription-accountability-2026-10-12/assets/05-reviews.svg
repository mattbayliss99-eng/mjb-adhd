<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Reviews are not interchangeable.</title><desc id="desc">Three distinct processes: the Lampard statutory inquiry into Essex mental-health inpatient deaths in 2000–2023; the Nottinghamshire CQC special review published March 2024; and the Greater Manchester independent assurance review published May 2026. These examples are not a national count of trusts currently under statutory investigation.</desc><rect width="1080" height="1350" fill="#080e12"/><rect x="0" y="0" width="1080" height="12" rx="20" fill="#79f5b0"/><text x="64" y="79.75" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">MJB ADHD  /  ACCOUNTABILITY</text><text x="876" y="79.75" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">05 / 08</text><text x="64" y="195.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">Reviews are not</text><text x="64" y="273.88" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="68" font-weight="700">interchangeable.</text><text x="64" y="346.21" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400">Three examples of different accountability processes.</text><rect x="64" y="389" width="952" height="212" rx="20" fill="#122027"/><text x="90" y="432.66" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">ESSEX • STATUTORY INQUIRY</text><text x="90" y="483.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Lampard: mental-health inpatient deaths,</text><text x="90" y="524.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">2000–2023.</text><rect x="64" y="624" width="952" height="212" rx="20" fill="#122027"/><text x="90" y="667.66" fill="#76dcf3" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">NOTTINGHAMSHIRE • CQC SPECIAL REVIEW</text><text x="90" y="718.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Patient safety and quality of care; published March</text><text x="90" y="759.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">2024.</text><rect x="64" y="859" width="952" height="212" rx="20" fill="#122027"/><text x="90" y="902.66" fill="#ffc778" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">GREATER MANCHESTER • ASSURANCE REVIEW</text><text x="90" y="953.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">Implementation after the independent review;</text><text x="90" y="994.94" fill="#f3f7f5" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="400">published May 2026.</text><path d="M64,1130 L1016,1130" stroke="#76dcf3" stroke-width="2"/><text x="64" y="1182.21" fill="#79f5b0" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700">Identify the process. Verify the change.</text><text x="64" y="1270.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Lampard [P12] • CQC [P13] • NHS England [P14]</text><text x="64" y="1330.93" fill="#bbccc7" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">mjb-adhd.org.uk  •  12 October 2026</text></svg>